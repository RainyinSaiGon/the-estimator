name: Sites release artifact

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sites-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sites-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check types and evaluation invariants
        run: |
          npm run typecheck
          node --experimental-strip-types --test tests/estimator.test.mjs tests/workflow-source-evidence.test.mjs tests/sites-delivery-evaluation.test.mjs tests/workflow-product-selection.test.mjs
      - name: Build the complete Sites application
        run: npm run build:legacy
      - name: Check compiled Worker workflows with isolated local storage
        run: node scripts/check-sites-workflow.mjs
      - name: Package exact GitHub source and release provenance
        run: node scripts/package-sites-release.mjs "$RUNNER_TEMP/sites-release.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sites-release-${{ github.sha }}
          path: ${{ runner.temp }}/sites-release.tar.gz
          if-no-files-found: error
          retention-days: 14
