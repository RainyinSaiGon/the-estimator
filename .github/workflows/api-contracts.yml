name: API contracts

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "contracts/**"
      - "services/**"
      - "scripts/check_bff_route.mjs"
      - "scripts/check_web_health.mjs"
      - "scripts/validate_contracts.py"
      - "package.json"
      - "package-lock.json"
      - "apps/web/package.json"
      - "apps/web/app/api/v1/preview/**"
      - "apps/web/app/health/**"
      - "apps/web/lib/operations.ts"
      - "compose.yaml"
      - "Dockerfile.web"
      - ".dockerignore"
      - "docs/service-operations.md"
      - "apps/web/app/workspace/**"
      - "apps/web/app/api/workflow/**"
      - "apps/web/lib/*workflow*.ts"
      - "apps/web/lib/knowledge-mcp*.ts"
      - "apps/web/lib/reference-profiles.ts"
      - "tests/workflow-*.test.mjs"
      - "compose.private-records*"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "contracts/**"
      - "services/**"
      - "scripts/check_bff_route.mjs"
      - "scripts/check_web_health.mjs"
      - "scripts/validate_contracts.py"
      - "package.json"
      - "package-lock.json"
      - "apps/web/package.json"
      - "apps/web/app/api/v1/preview/**"
      - "apps/web/app/health/**"
      - "apps/web/lib/operations.ts"
      - "compose.yaml"
      - "Dockerfile.web"
      - ".dockerignore"
      - "docs/service-operations.md"
      - "apps/web/app/workspace/**"
      - "apps/web/app/api/workflow/**"
      - "apps/web/lib/*workflow*.ts"
      - "apps/web/lib/knowledge-mcp*.ts"
      - "apps/web/lib/reference-profiles.ts"
      - "tests/workflow-*.test.mjs"
      - "compose.private-records*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-contracts:
    name: Validate API contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      workflow-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: workflow-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      WORKFLOW_TEST_DATABASE_URL: postgres://postgres:workflow-ci-only@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.0"
          cache-dependency-path: services/estimator-go/go.mod

      - name: Install BFF, contract and service dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install --disable-pip-version-check \
            -r contracts/requirements.txt \
            -r services/brief-intelligence/requirements.txt

      - name: Validate schemas against live service payloads
        run: npm run check:contracts

      - name: Lint native workflow changes
        run: >-
          npx eslint apps/web/app/workspace apps/web/app/api/workflow
          apps/web/app/page.tsx apps/web/app/layout.tsx apps/web/app/sign-in/sign-in-form.tsx
          apps/web/lib/brief-service-auth.ts apps/web/lib/workflow-*.ts
          apps/web/lib/gmail-workflow.ts apps/web/lib/knowledge-mcp*.ts
          apps/web/lib/reference-profiles.ts services/workflow-worker/worker.mjs
          tests/workflow-*.test.mjs

      - name: Build native web and check secret boundary
        run: |
          npm run typecheck
          npm run build
          npm run check:secrets

      - name: Test workflow, knowledge protocol and worker
        run: |
          npm test
          python -m unittest discover -s services/brief-intelligence -p 'test_*.py'
          cd services/estimator-go
          go test ./cmd/estimator
