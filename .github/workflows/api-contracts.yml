name: API contracts

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "contracts/**"
      - "services/**"
      - "scripts/validate_contracts.py"
      - "package.json"
      - "apps/web/package.json"
      - "apps/web/app/api/v1/preview/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "contracts/**"
      - "services/**"
      - "scripts/validate_contracts.py"
      - "package.json"
      - "apps/web/package.json"
      - "apps/web/app/api/v1/preview/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-contracts:
    name: Validate API contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.0"
          cache-dependency-path: services/estimator-go/go.mod

      - name: Install contract and service dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r contracts/requirements.txt \
            -r services/brief-intelligence/requirements.txt

      - name: Validate schemas against live service payloads
        run: npm run check:contracts
