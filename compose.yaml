services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      BRIEF_SERVICE_URL: http://brief:8001
      ESTIMATOR_SERVICE_URL: http://estimator:8002
    depends_on:
      brief:
        condition: service_healthy
      estimator:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  brief:
    build:
      context: .
      dockerfile: services/brief-intelligence/Dockerfile
    expose:
      - "8001"

  estimator:
    build:
      context: .
      dockerfile: services/estimator-go/Dockerfile
    expose:
      - "8002"
